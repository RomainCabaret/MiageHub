<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:comp="jakarta.faces.composite/components"
>
    <ui:define name="title">MiageHub - ProgressBAR</ui:define>

    <ui:define name="activePageParam">
        <comp:navBar activePage="progres" />
    </ui:define>

    <ui:define name="head-resources">
        <h:outputStylesheet library="css" name="progress.css"/>
    </ui:define>


    <ui:define name="content">

        <h:form id="refreshForm">
            <!-- Cette balise crée une fonction JS nommée 'triggerRefresh' -->
            <h:commandScript name="triggerRefresh"
                             action="#{progressBean.updateTimestamps}"
                             render="chronoGrid" />
        </h:form>

        <!-- ── En-tête ─────────────────────────────────────────────────── -->
        <header class="dash-header">
            <div class="dash-title">Miage Progress</div>
        </header>


        <h:panelGroup id="chronoGrid" layout="block" styleClass="dash-grid">
            <div class="section-sep">HORAIRE</div>

            <comp:progressBar label="#{progressBean.minuteBar.label}"
                              startTime="#{progressBean.minuteBar.startTime}"
                              endTime="#{progressBean.minuteBar.endTime}"
                              hexColor="#c84bff"
                              rendered="#{progressBean.minuteBar.active}" />

            <comp:progressBar label="#{progressBean.hourBar.label}"
                              startTime="#{progressBean.hourBar.startTime}"
                              endTime="#{progressBean.hourBar.endTime}"
                              hexColor="#ffd700" />

            <comp:progressBar label="#{progressBean.monthBar.label}"
                              startTime="#{progressBean.monthBar.startTime}"
                              endTime="#{progressBean.monthBar.endTime}"
                              hexColor="#00f5d4" />

            <comp:progressBar label="#{progressBean.yearBar.label}"
                              startTime="#{progressBean.yearBar.startTime}"
                              endTime="#{progressBean.yearBar.endTime}"
                              hexColor="#f97316" />

            <comp:progressBar label="#{progressBean.centuryBar.label}"
                              startTime="#{progressBean.centuryBar.startTime}"
                              endTime="#{progressBean.centuryBar.endTime}"
                              hexColor="#d4af37" />

            <div class="section-sep">EXAMEN</div>

            <comp:progressBar label="#{progressBean.examBar.label}"
                              startTime="#{progressBean.examBar.startTime}"
                              endTime="#{progressBean.examBar.endTime}"
                              hexColor="#ff416c"
                              rendered="#{progressBean.examBar.active}" />

            <comp:progressBar label="#{progressBean.sessionBar.label}"
                              startTime="#{progressBean.sessionBar.startTime}"
                              endTime="#{progressBean.sessionBar.endTime}"
                              hexColor="#ec4899"
                              rendered="#{progressBean.sessionBar.active}" />

            <div class="section-sep">MASTER MIAGE</div>

            <comp:progressBar label="#{progressBean.endingMasterBar.label}"
                              startTime="#{progressBean.endingMasterBar.startTime}"
                              endTime="#{progressBean.endingMasterBar.endTime}"
                              hexColor="#6366f1"
                              rendered="#{progressBean.endingMasterBar.active}" />

            <comp:progressBar label="#{progressBean.nextItNight.label}"
                              startTime="#{progressBean.nextItNight.startTime}"
                              endTime="#{progressBean.nextItNight.endTime}"
                              hexColor="#2563eb"
                              rendered="#{progressBean.nextItNight.active}" />

            <comp:progressBar label="#{progressBean.nextBigEvent.label}"
                              startTime="#{progressBean.nextBigEvent.startTime}"
                              endTime="#{progressBean.nextBigEvent.endTime}"
                              hexColor="#10b981"
                              rendered="#{progressBean.nextBigEvent.active}" />

<!--            <comp:progressBar label="#{progressBean.nextCompanyProgress.label}"-->
<!--                              startTime="#{progressBean.nextCompanyProgress.startTime}"-->
<!--                              endTime="#{progressBean.nextCompanyProgress.endTime}"-->
<!--                              hexColor="#8b5cf6"-->
<!--                              rendered="#{progressBean.nextCompanyProgress.active}" />-->

            <div class="section-sep">CFA</div>

            <comp:progressBar label="#{progressBean.nextIziaForm.label}"
                              startTime="#{progressBean.nextIziaForm.startTime}"
                              endTime="#{progressBean.nextIziaForm.endTime}"
                              hexColor="#06b6d4"
                              rendered="#{progressBean.nextIziaForm.active}" />

            <div class="section-sep">INSOLITE</div>

            <comp:progressBar label="#{progressBean.nextSolarEclipse.label}"
                              startTime="#{progressBean.nextSolarEclipse.startTime}"
                              endTime="#{progressBean.nextSolarEclipse.endTime}"
                              hexColor="#64748b"
                              rendered="#{progressBean.nextSolarEclipse.active}" />
        </h:panelGroup>

        <h:outputScript library="js" name="progress.js" target="body"/>

    </ui:define>

</ui:composition>
