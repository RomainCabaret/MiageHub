<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="template.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:comp="jakarta.faces.composite/components"
>
    <ui:define name="title">MiageHub - ProgressBAR</ui:define>

    <ui:define name="activePageParam">
        <comp:navBar activePage="progres" />
    </ui:define>

    <ui:define name="head-resources">
        <h:outputStylesheet library="css" name="progress.css"/>
    </ui:define>


    <ui:define name="content">

        <h:form id="refreshForm">
            <!-- Cette balise crée une fonction JS nommée 'triggerRefresh' -->
            <h:commandScript name="triggerRefresh"
                             action="#{progressBean.updateTimestamps}"
                             render="chronoGrid" />
        </h:form>

        <!-- ── En-tête ─────────────────────────────────────────────────── -->
        <header class="dash-header">
            <div class="dash-title">Miage Progress</div>
        </header>


        <!-- ── Grille principale ───────────────────────────────────────── -->
        <h:panelGroup id="chronoGrid" layout="block" styleClass="dash-grid">
            <div class="section-sep">Test de progression</div>

            <comp:progressBar label="Chrono 60 secondes"
                              startTime="#{progressBean.startTime}"
                              endTime="#{progressBean.endTime}"
                              type="secondes"
                              hexColor="#c84bff" />

            <div class="section-sep">Fun</div>

        </h:panelGroup>


        <h:outputScript library="js" name="progress.js" target="body"/>

    </ui:define>

</ui:composition>
